name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      
      - name: Setup Flutter Project
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create . --project-name king_chat --org com.kingchat --platforms android
            rm lib/main.dart
            git checkout main -- lib/main.dart || git checkout HEAD -- lib/main.dart || echo "main.dart keep"
          fi
          # Ensure we keep our code
          cat lib/main.dart | head -20
      
      - name: Pub Get
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release --verbose
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: king-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
